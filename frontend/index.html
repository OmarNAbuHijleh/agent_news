<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic News Research</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Agentic News Research</h1>
      <button id="new-investigation-button" type="button" hidden>New Investigation</button>
    </div>
    <p class="subtitle" id="subtitle">Ask about a topic. You'll see the plan, research, and fact-checking as they happen, not just the final answer.</p>
  </header>

  <main id="transcript" aria-live="polite"></main>

  <div id="trending-section" hidden>
    <span class="trending-label">Trending:</span>
    <div id="trending-topics" class="trending-topics"></div>
  </div>

  <div id="status-banner" hidden>
    <button type="button" disabled>Query is being performed. No other actions can be performed until it is complete. Search bar will return once the query is complete.</button>
  </div>

  <form id="query-form">
    <input
      id="query-input"
      type="text"
      placeholder="e.g. Nvidia stock price"
      autocomplete="off"
      required
    >
    <button id="send-button" type="submit">Send</button>
  </form>

  <script src="/app.js"></script>
</body>
</html>
